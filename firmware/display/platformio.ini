; 1.91" LilyGO T-Display-S3 AMOLED (RM67162, optional CST816 touch).
; USB CDC is the link. The host sends SHOW frames; taps come back as BTN lines.

[platformio]
boards_dir = boards
default_envs = tdisplay-s3-amoled

[env:tdisplay-s3-amoled]
platform = espressif32@6.12.0
board = T-Display-AMOLED
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem3101
monitor_port = /dev/cu.usbmodem3101
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.9
    lewisxhe/SensorLib @ 0.2.4
